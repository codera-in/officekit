<script>
const icons={toolkit:'<path d="M10 11V8a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v3M5 12h22v14H5zM5 17h22M14 16v4h4v-4M23 12v5h4"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>',tools:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',star:'<path d="m12 3 2.8 5.8 6.4.9-4.6 4.5 1.1 6.4-5.7-3-5.7 3 1.1-6.4L3.8 9.7l6.4-.9z"/>',history:'<path d="M3 10a9 9 0 1 1 2 8M3 4v6h6M12 7v5l3 2"/>',bookmark:'<path d="M6 3h12v18l-6-4-6 4z"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 0 1 6 0c0 2-3 2-3 4M12 17h.01"/>',settings:'<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="10" cy="18" r="2"/>',calc:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h1M15 12h1M8 16h1M15 16h1"/>',image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1"/><path d="m4 17 5-5 4 4 3-3 5 5"/>',pdf:'<path d="M6 3h8l4 4v14H6zM14 3v5h4M9 12h6M9 16h6"/>',arrow:'<path d="m9 5 7 7-7 7"/>',back:'<path d="m14 5-7 7 7 7"/>',check:'<path d="m5 12 4 4L19 6"/>',copy:'<rect x="8" y="8" width="12" height="13" rx="2"/><path d="M15 8V3H3v13h5"/>',export:'<path d="M12 3v12M7 8l5-5 5 5M4 14v7h16v-7"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',shield:'<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6zM8 12l3 3 5-6"/>'};
const icon=(name)=>`<svg viewBox="0 0 ${name==='toolkit'?'32 32':'24 24'}" aria-hidden="true">${icons[name]||icons.tools}</svg>`;
const escapeHTML=(value)=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const registry=[{id:'loan',name:'Loan calculator',desc:'Payments and repayment schedule',category:'Calculators',icon:'calc',aliases:'emi mortgage interest finance'},{id:'image',name:'Convert images',desc:'JPEG, PNG and WebP',category:'Images',icon:'image',aliases:'jpg resize compress'},{id:'pdf',name:'Merge PDFs',desc:'Combine documents in order',category:'PDF & documents',icon:'pdf',aliases:'join combine document'}];
let galleryView='gallery',categoryFilter='all';
let route='tools',query='',favoriteIds=new Set(['loan']),recentIds=['loan','image'],operations=[],selected=null,current=null,historyFilter='all',draft={currency:'USD',principal:25000,rate:7.5,years:5},errors={},stale=false,exportSnapshot=null,opSequence=0,toastTimer,feedbackType='bug';
const main=document.getElementById('main'),exportDialog=document.getElementById('export-dialog'),systemTheme=matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){const choice=document.getElementById('theme').value;document.documentElement.dataset.theme=choice==='system'?(systemTheme.matches?'dark':'light'):choice}
systemTheme.addEventListener('change',()=>{if(document.getElementById('theme').value==='system')applyTheme()});applyTheme();
const navItems={tools:['tools','Tools'],favorites:['star','Favorites'],history:['history','History'],feedback:['help','Help & feedback'],settings:['settings','Settings']};
document.getElementById('brand').innerHTML=icon('toolkit')+'OfficeKit';document.querySelectorAll('[data-nav]').forEach(b=>{const [i,t]=navItems[b.dataset.nav];b.innerHTML=icon(i)+t});document.getElementById('close-export').innerHTML=icon('close');
function notify(message){const node=document.getElementById('toast');node.textContent=message;node.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.hidden=true,5000)}
function navigate(next){route=next;errors={};render();main.focus({preventScroll:true})}
function heading(title,desc='',actions=''){return `<div class="pagehead"><div><h1>${title}</h1>${desc?`<p class="muted">${desc}</p>`:''}</div>${actions||`<span class="badge">${icon('shield')}Local processing</span>`}</div>`}
function favorite(id){favoriteIds.has(id)?favoriteIds.delete(id):favoriteIds.add(id);const focusId='favorite-'+id;render();document.getElementById(focusId)?.focus()}
function toolCard(t){return `<div class="toolcard"><button class="open" onclick="openTool('${t.id}')"><span class="toolglyph">${icon(t.icon)}</span><h3>${t.name}</h3><small>${t.desc}</small></button><button class="favorite" id="favorite-${t.id}" aria-label="${favoriteIds.has(t.id)?'Remove '+t.name+' from':'Add '+t.name+' to'} favorites" aria-pressed="${favoriteIds.has(t.id)}" onclick="favorite('${t.id}')">${icon('star')}</button></div>`}
function empty(title,message,action=''){return `<div class="empty">${icon('bookmark')}<h2>${title}</h2><p>${message}</p>${action}</div>`}
function listTool(t){return `<div class="listrow"><button class="rowopen" onclick="openTool('${t.id}')"><strong>${t.name}</strong><small>${t.category}</small></button><span class="arrow">${icon('arrow')}</span></div>`}
function openTool(id){recentIds=[id,...recentIds.filter(x=>x!==id)];if(id!=='loan'){route=id;render();main.focus({preventScroll:true});return}navigate('calculator')}
function render(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===route||(route==='calculator'&&b.dataset.nav==='tools')||(route==='saved'&&b.dataset.nav==='history')));
if(route==='tools'){main.innerHTML=heading('Your everyday tools','Find what you need. Keep what matters.')+`<div class="searchbox">${icon('search')}<label class="sr" for="search">Search tools</label><input id="search" type="search" placeholder="Search tools — try loan, image or PDF" value="${escapeHTML(query)}" oninput="query=this.value;renderToolMatches()" onkeydown="searchKey(event)"><kbd>${navigator.platform.includes('Mac')?'⌘':'Ctrl'} K</kbd></div><section id="tool-matches"></section>`;renderToolMatches();return}
if(route==='favorites'){main.innerHTML=heading('Favorites','Tools you reach for often.')+(favoriteIds.size?`<div class="toolgrid">${registry.filter(t=>favoriteIds.has(t.id)).map(toolCard).join('')}</div>`:empty('Your shortcuts start here','Star a tool to keep it in Favorites.','<button class="primary" onclick="navigate(\'tools\')">Browse tools</button>'));return}
if(route==='calculator'){main.innerHTML=`<div class="breadcrumb"><button class="quiet" onclick="navigate('tools')">${icon('back')} Tools</button></div>`+heading('Loan calculator','Monthly payments, with the assumptions visible.',`<div class="headtools"><button class="quiet" id="favorite-loan" aria-pressed="${favoriteIds.has('loan')}" onclick="favorite('loan')">${favoriteIds.has('loan')?'★ Favorited':'☆ Favorite tool'}</button><button class="quiet" onclick="historyFilter='loan';navigate('history')">Tool history</button></div>`)+`<div class="work"><form class="panel" onsubmit="event.preventDefault();calculate()" novalidate><h2>Loan details</h2>${field('currency','Currency','select')}${field('principal','Loan amount','number')}${field('rate','Annual interest rate (%)','number')}${field('years','Term (years)','number')}<button class="primary formaction" type="submit">Calculate</button><p class="hint">Fixed rate, monthly payments. Fees and extra repayments excluded.</p></form><section class="panel" aria-label="Calculation result" id="result-slot">${current?resultHTML(current):empty('Your result will appear here','Enter your loan details and calculate.')}</section></div>`;return}
if(route==='history'){const items=operations.filter(o=>historyFilter!=='saved'||o.saved);main.innerHTML=heading('History','Your results, kept on this device.')+`<div class="filters"><button aria-pressed="${historyFilter==='all'}" onclick="historyFilter='all';render()">All</button><button aria-pressed="${historyFilter==='saved'}" onclick="historyFilter='saved';render()">Saved</button><button aria-pressed="${historyFilter==='loan'}" onclick="historyFilter='loan';render()">Loan calculator</button></div>`+(items.length?`<div class="list">${items.map(o=>`<div class="listrow"><button class="rowopen" onclick="reopen('${o.id}')"><strong>${o.saved?'▣ ':''}${escapeHTML(o.title)}</strong><small>${money(o.inputs.principal,o.inputs.currency)} · ${o.inputs.rate}% · ${o.inputs.years} years</small><small>${money(o.payment,o.inputs.currency)} / month · ${timeLabel(o.createdAt)}</small></button><button class="quiet" aria-label="${o.saved?'Remove bookmark from':'Save'} ${escapeHTML(o.title)}" aria-pressed="${o.saved}" onclick="toggleSaved('${o.id}')">${icon('bookmark')}</button></div>`).join('')}</div>`:empty(historyFilter==='saved'?'No saved results yet':'No results yet',historyFilter==='saved'?'Save a result to keep it here.':'Complete a calculation to start your history.','<button class="primary" onclick="openTool(\'loan\')">Open loan calculator</button>'))+`<p class="notice">Demo records last until reload. Production proposal: unsaved history expires after 30 days; saved results remain until removed.</p>`;return}
if(route==='saved'){const o=operations.find(x=>x.id===selected);if(!o){navigate('history');return}main.innerHTML=`<div class="breadcrumb"><button class="quiet" onclick="navigate('history')">${icon('back')} History</button></div>`+heading(escapeHTML(o.title),`Original result · ${timeLabel(o.createdAt)}`)+`<div class="savedlayout"><section class="panel">${resultHTML(o,true)}<label class="field savefield">Result name<input id="saved-title" maxlength="80" value="${escapeHTML(o.title)}"></label><button onclick="renameResult('${o.id}')">Save name</button><p class="notice">This original result does not recalculate when reopened. Use these inputs prepares a new calculation.</p></section></div>`;return}
if(route==='settings'){main.innerHTML=heading('Settings','Your preferences stay on this device.')+`<section class="panel privacy"><h2>Privacy</h2><p>Both sharing options are off by default. Local tools, bookmarks and exports work either way.</p><label class="check"><input type="checkbox" id="usage"><span><strong>Share anonymous usage counts</strong><small>Tool IDs, completion counts, broad error categories and export formats. No inputs, results, documents, filenames, paths or secrets.</small></span></label><label class="check"><input type="checkbox" id="heartbeat"><span><strong>Share an activity heartbeat</strong><small>At most once a day while open: app version and OS family. No persistent device ID or background service.</small></span></label><details><summary>Network and retention details</summary><p>Server infrastructure sees source IPs. Analytics excludes them; operational log retention must be minimized. No collection before consent. Turning sharing off removes queued events. Previously sent anonymous counts cannot reliably be linked back to you.</p></details><div class="toolbar" style="margin-top:20px"><button class="primary" onclick="notify('Prototype only. Choices are not stored and no data is sent.')">Save choices</button><button onclick="document.getElementById('usage').checked=false;document.getElementById('heartbeat').checked=false;notify('Both choices are off. Prototype only.')">Keep sharing off</button></div><h2>Appearance</h2><p class="muted">Use System, Light or Dark in the navigation. Demo choice resets on reload.</p></section>`;return}
if(route==='feedback'){main.innerHTML=heading('Help & feedback','Tell us what would make OfficeKit more useful.')+`<div class="filters feedbacktabs">${[['bug','Report a bug'],['feature','Request a feature'],['testimonial','Leave a testimonial']].map(([id,label])=>`<button aria-pressed="${feedbackType===id}" onclick="feedbackType='${id}';render()">${label}</button>`).join('')}</div><section class="panel privacy"><label class="field">${feedbackType==='bug'?'What happened, and what did you expect?':feedbackType==='feature'?'What task would you like to accomplish?':'How has OfficeKit helped you?'}<textarea rows="4"></textarea></label><label class="field">${feedbackType==='testimonial'?'Display name (optional)':'Email for a reply (optional)'}<input type="${feedbackType==='testimonial'?'text':'email'}"></label>${feedbackType==='bug'?'<label class="check"><input type="checkbox">Attach diagnostics</label><details><summary>Preview diagnostics</summary><p>App version, OS family, tool ID and allowlisted error code. No file contents or paths.</p></details>':''}${feedbackType==='testimonial'?'<label class="check"><input type="checkbox">OfficeKit may publish this testimonial with my display name.</label>':''}<div class="toolbar" style="margin-top:20px"><button class="primary" onclick="notify('Prototype only. No feedback was sent.')">Send feedback</button><button onclick="notify('Prototype only. No draft was stored.')">Save draft</button></div><p class="hint">Sending needs an internet connection. A local draft is not a delivered ticket.</p></section>`;return}
if(route==='image'||route==='pdf'){const isImage=route==='image';main.innerHTML=`<div class="breadcrumb"><button class="quiet" onclick="navigate('tools')">${icon('back')} Tools</button></div>`+heading(isImage?'Convert images':'Merge PDFs')+`<section class="panel">${empty('This flow is outside the prototype','The full interactive flow is available in Loan calculator. These category destinations demonstrate navigation only.','<button class="primary" onclick="openTool(\'loan\')">Try loan calculator</button>')}</section>`}
}
function renderToolMatches(){
const area=document.getElementById('tool-matches');if(!area)return;
const q=query.trim().toLowerCase(),categories=[...new Set(registry.map(t=>t.category))].sort();
const matches=registry.filter(t=>(categoryFilter==='all'||t.category===categoryFilter)&&(t.name+' '+t.aliases+' '+t.category).toLowerCase().includes(q));
const shortcuts=!q&&categoryFilter==='all'?'<h2>Favorites</h2>'+(favoriteIds.size?'<div class="list">'+registry.filter(t=>favoriteIds.has(t.id)).map(listTool).join('')+'</div>':'<p class="muted">Star a tool in the gallery to add a shortcut here.</p>')+'<h2 style="margin-top:28px">Recently used</h2><div class="list">'+recentIds.map(id=>listTool(registry.find(t=>t.id===id))).join('')+'</div>':'';
const bar=`<div class="gallerybar"><label>Category <select aria-label="Tool category" onchange="categoryFilter=this.value;renderToolMatches()"><option value="all">All categories</option>${categories.map(c=>`<option value="${escapeHTML(c)}" ${categoryFilter===c?'selected':''}>${c}</option>`).join('')}</select></label><div class="viewbuttons" role="group" aria-label="Tool view"><button aria-pressed="${galleryView==='gallery'}" onclick="galleryView='gallery';renderToolMatches()">Gallery</button><button aria-pressed="${galleryView==='list'}" onclick="galleryView='list';renderToolMatches()">List</button></div></div>`;
const groups=categories.map(c=>{const tools=matches.filter(t=>t.category===c).sort((a,b)=>a.name.localeCompare(b.name));if(!tools.length)return '';const rows=tools.map(t=>`<div class="listrow"><button class="rowopen" onclick="openTool('${t.id}')"><strong>${t.name}</strong><small>${t.desc}</small></button><button class="quiet" id="favorite-${t.id}" aria-label="${favoriteIds.has(t.id)?'Remove '+t.name+' from':'Add '+t.name+' to'} favorites" aria-pressed="${favoriteIds.has(t.id)}" onclick="favorite('${t.id}')">${icon('star')}</button></div>`).join('');return `<section class="gallerygroup"><h2>${c} <small>${tools.length} ${tools.length===1?'tool':'tools'}</small></h2>${galleryView==='gallery'?`<div class="toolgrid">${tools.map(toolCard).join('')}</div>`:`<div class="list">${rows}</div>`}</section>`}).join('');
area.innerHTML=shortcuts+bar+(matches.length?groups:empty('No matching tools','Change your search or category filter.','<button onclick="query=\'\';categoryFilter=\'all\';render();document.getElementById(\'search\').focus()">Clear search & filter</button>'));
}

function searchKey(event){if(event.key==='Enter'){const q=query.trim().toLowerCase(),first=registry.find(t=>(categoryFilter==='all'||t.category===categoryFilter)&&(t.name+' '+t.aliases+' '+t.category).toLowerCase().includes(q));if(first)openTool(first.id)}}
function field(id,label,type){const error=errors[id];const input=type==='select'?`<select id="${id}" onchange="editInput('${id}',this.value)">${['USD','INR','EUR','GBP'].map(c=>`<option ${draft.currency===c?'selected':''}>${c}</option>`).join('')}</select>`:`<input id="${id}" type="number" value="${draft[id]}" ${id==='rate'?'step="0.1"':'step="any"'} aria-invalid="${!!error}" ${error?`aria-describedby="${id}-error"`:''} oninput="editInput('${id}',this.value)">`;return `<label class="field" for="${id}">${label}${input}${error?`<span class="error" id="${id}-error">${error}</span>`:''}</label>`}
function editInput(id,value){draft[id]=id==='currency'?value:(value===''?'':Number(value));stale=!!current&&Object.keys(draft).some(k=>draft[k]!==current.inputs[k]);if(current)document.getElementById('result-slot').innerHTML=resultHTML(current)}
function computeLoan(input){const n=Math.round(input.years*12),r=input.rate/1200,p=input.principal,payment=r===0?p/n:p*r/(-Math.expm1(-n*Math.log1p(r)));let balance=p;const schedule=[];for(let month=1;month<=n;month++){const interest=balance*r,paid=month===n?balance+interest:payment,principal=paid-interest;balance=Math.max(0,balance-principal);schedule.push({month,payment:paid,principal,interest,balance})}return {payment,total:payment*n,interest:payment*n-p,schedule}}
function calculate(){errors={};if(!Number.isFinite(draft.principal)||draft.principal<=0||draft.principal>1e12)errors.principal='Enter an amount greater than 0 and at most 1 trillion.';if(!Number.isFinite(draft.rate)||draft.rate<0||draft.rate>100)errors.rate='Enter a rate from 0 to 100%.';if(!Number.isFinite(draft.years)||draft.years<=0||draft.years>50||Math.abs(draft.years*12-Math.round(draft.years*12))>1e-7)errors.years='Enter a term up to 50 years in whole months.';if(Object.keys(errors).length){render();document.getElementById(Object.keys(errors)[0]).focus();notify('Check the highlighted loan details.');return}const inputs={...draft,years:Math.round(draft.years*12)/12};const result=computeLoan(inputs);current={id:'demo-'+(++opSequence),toolId:'loan',engineVersion:'demo-1',createdAt:new Date().toISOString(),inputs,...result,saved:false,title:'Loan payment — '+money(inputs.principal,inputs.currency)};operations.unshift(current);stale=false;render();notify('Calculation complete. You can export or save this result.')}
function money(value,currency){return new Intl.NumberFormat(undefined,{style:'currency',currency,maximumFractionDigits:2}).format(value)}
function number(value){return new Intl.NumberFormat(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}).format(value)}
function timeLabel(value){return new Intl.DateTimeFormat(undefined,{dateStyle:'medium',timeStyle:'short'}).format(new Date(value))}
function resultHTML(o,reopened=false){return `${stale&&!reopened?`<div class="callout">${icon('history')}<span>Inputs changed — calculate to update. Actions below use the displayed original result.</span></div>`:''}<div class="resultstatus">${icon('check')}${reopened?'Original calculation':'Calculation complete'}</div><small>Monthly payment</small><div class="principal">${money(o.payment,o.inputs.currency)}</div><div class="metrics"><div><small>Total interest</small><strong>${money(o.interest,o.inputs.currency)}</strong></div><div><small>Total repayment</small><strong>${money(o.total,o.inputs.currency)}</strong></div></div><div class="toolbar"><button class="primary" onclick="openExport('${o.id}')">${icon('export')}Export…</button><button aria-pressed="${o.saved}" id="bookmark-${o.id}" onclick="toggleSaved('${o.id}')">${icon('bookmark')}${o.saved?'Saved':'Save result'}</button><button onclick="copyResult('${o.id}')">${icon('copy')}Copy</button>${reopened?`<button onclick="reuseInputs('${o.id}')">Use these inputs</button>`:''}</div><p class="context">${money(o.inputs.principal,o.inputs.currency)} at ${o.inputs.rate}% over ${o.inputs.years} years.</p><details><summary>Inputs & assumptions</summary><p>${o.inputs.currency}. Fixed annual rate; ${o.inputs.years*12} monthly payments. No fees or extra repayments. Values rounded for display. Original result: ${timeLabel(o.createdAt)}. Engine: ${o.engineVersion}.</p></details><details><summary>Repayment schedule (${o.schedule.length} months)</summary><div class="tablewrap">${scheduleTable(o,12)}</div><p>First ${Math.min(12,o.schedule.length)} months shown. Production exports include the complete schedule when selected.</p></details>`}
function scheduleTable(o,limit){return `<table><caption class="sr">Repayment schedule in ${o.inputs.currency}</caption><thead><tr><th scope="col">Month</th><th scope="col">Payment</th><th scope="col">Principal</th><th scope="col">Interest</th><th scope="col">Balance</th></tr></thead><tbody>${o.schedule.slice(0,limit).map(r=>`<tr><th scope="row">${r.month}</th><td>${number(r.payment)}</td><td>${number(r.principal)}</td><td>${number(r.interest)}</td><td>${number(r.balance)}</td></tr>`).join('')}</tbody></table>`}
function toggleSaved(id){const o=operations.find(x=>x.id===id);o.saved=!o.saved;render();document.getElementById('bookmark-'+id)?.focus();notify(o.saved?'Saved to History → Saved.':'Bookmark removed. The original history entry remains.')}
function reopen(id){selected=id;navigate('saved')}
function reuseInputs(id){draft={...operations.find(o=>o.id===id).inputs};current=null;stale=false;navigate('calculator');document.getElementById('principal').focus();notify('Original inputs loaded. Calculate to create a new result.')}
function renameResult(id){const value=document.getElementById('saved-title').value.trim();if(!value){notify('Enter a result name.');document.getElementById('saved-title').focus();return}operations.find(o=>o.id===id).title=value;render();notify('Result name updated for this demo session.')}
async function copyResult(id){const o=operations.find(x=>x.id===id),text=`OfficeKit loan calculation\nPrincipal: ${money(o.inputs.principal,o.inputs.currency)}\nAnnual rate: ${o.inputs.rate}%\nTerm: ${o.inputs.years} years, monthly payments\nMonthly payment: ${money(o.payment,o.inputs.currency)}\nTotal interest: ${money(o.interest,o.inputs.currency)}\nNo fees or extra repayments.`;try{await navigator.clipboard.writeText(text);notify('Result and input summary copied.')}catch{notify('Clipboard unavailable in this local preview. Production copy needs a supported clipboard adapter.')}}
function openExport(id){exportSnapshot=operations.find(o=>o.id===id);document.getElementById('export-subtitle').textContent=exportSnapshot.title;document.getElementById('export-success').hidden=true;renderPreview();exportDialog.showModal()}
function closeExport(){exportDialog.close()}
function renderPreview(){const o=exportSnapshot;if(!o)return;const format=document.getElementById('export-format').value,isCSV=format==='CSV',isImage=format==='JPEG'||format==='PNG';document.getElementById('footer-control').hidden=isCSV;document.getElementById('meta-control').hidden=isCSV;document.getElementById('metadata-help').hidden=isCSV;document.getElementById('schedule-control').hidden=isImage;document.getElementById('export-success').hidden=true;document.getElementById('format-help').textContent={PDF:'Printable report with inputs, assumptions and optional schedule.',CSV:'Clean tabular data with explicit currency. No promotional rows.',JPEG:'Shareable summary on white. PNG is sharper for text.',PNG:'Lossless summary image for crisp text and numbers.'}[format];document.getElementById('preview-help').textContent=isCSV?'Summary preview. Schedule exports as a separate CSV in a selected ZIP bundle.':isImage?'Summary image preview. The app navigation is excluded.':'First-page preview. Complete schedules need pagination in production.';if(isCSV){document.getElementById('report-preview').innerHTML=`<h3>summary.csv</h3><pre class="csvpreview">metric,value,currency\nprincipal,${o.inputs.principal},${o.inputs.currency}\nannual_rate_percent,${o.inputs.rate},\nterm_months,${o.inputs.years*12},\nmonthly_payment,${o.payment.toFixed(2)},${o.inputs.currency}\ntotal_interest,${o.interest.toFixed(2)},${o.inputs.currency}\ntotal_repayment,${o.total.toFixed(2)},${o.inputs.currency}</pre><small>Numeric data stays numeric; no attribution row.</small>`;return}document.getElementById('report-preview').innerHTML=`${document.getElementById('include-footer').checked?`<div class="paperbrand">${icon('toolkit')}OfficeKit</div>`:''}<h3>Loan payment summary</h3><small>${money(o.inputs.principal,o.inputs.currency)} · ${o.inputs.rate}% · ${o.inputs.years*12} monthly payments</small><div class="principal">${money(o.payment,o.inputs.currency)}<small> / month</small></div><p>Total interest: ${money(o.interest,o.inputs.currency)}<br>Total repayment: ${money(o.total,o.inputs.currency)}</p><small>Fixed rate. No fees or extra repayments. Original calculation: ${timeLabel(o.createdAt)}.</small>${!isImage&&document.getElementById('include-schedule').checked?scheduleTable(o,3):''}${document.getElementById('include-footer').checked?`<footer class="paperfooter">Generated with OfficeKit · officekit.app<br>Export preview: ${timeLabel(new Date().toISOString())} · ${Intl.DateTimeFormat().resolvedOptions().timeZone}</footer>`:''}`}
function simulateExport(){const format=document.getElementById('export-format').value;document.getElementById('export-success').textContent=`${format} preview ready. Production would now offer a native save location. No file was generated.`;document.getElementById('export-success').hidden=false}
exportDialog.addEventListener('click',event=>{if(event.target===exportDialog){const rect=exportDialog.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closeExport()}});
window.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();if(exportDialog.open)closeExport();navigate('tools');document.getElementById('search').focus()}});
render();
</script></body></html>
