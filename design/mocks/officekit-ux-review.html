<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OfficeKit — UX review prototype</title>
<style>
:root{--ink:#202b36;--muted:#536373;--line:#d8e0e6;--paper:#fff;--ground:#f4f7f9;--blue:#185c89;--wash:#eaf3f9}*{box-sizing:border-box}body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;background:white;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:9px 14px}button:hover{background:var(--wash)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #3483b7;outline-offset:3px}button.primary{background:var(--blue);border-color:var(--blue);color:white}h1{font-size:29px;line-height:1.2;margin:0 0 10px}h2{font-size:19px;margin:0 0 15px}h3{font-size:16px;margin:0}p{margin:6px 0 18px}.muted,small{color:var(--muted)}.review{background:#202b36;color:white;padding:12px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}.review button{background:transparent;color:white;border-color:#687583;padding:5px 12px}.review button.active{background:white;color:var(--ink)}.layout{display:grid;grid-template-columns:205px 1fr;min-height:calc(100vh - 62px)}aside{background:white;border-right:1px solid var(--line);padding:27px 18px;display:flex;flex-direction:column;gap:6px}.brand{font-size:23px;font-weight:750;padding:0 10px 26px}aside button{border:0;text-align:left;background:transparent}aside button.selected{color:var(--blue);background:var(--wash);font-weight:650}.bottom{margin-top:auto;padding-top:60px}main{max-width:1130px;width:100%;padding:35px 45px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:30px}.top small{white-space:nowrap}.search{width:100%;padding:15px;border:1px solid #aebfcb;border-radius:7px;background:white;margin:8px 0 26px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.tool{background:white;border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;gap:8px;align-items:flex-start}.tool button:first-child{padding:0;border:0;text-align:left;flex:1}.star{border:0;padding:0 4px;font-size:20px;color:var(--blue)}section.block{margin-bottom:30px}.row{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding:15px 0}.row button{border:0;color:var(--blue);padding:7px 10px}.tags{display:flex;gap:8px;flex-wrap:wrap}.tags button.active{background:var(--wash);border-color:var(--blue);color:var(--blue)}.work{display:grid;grid-template-columns:300px 1fr;gap:25px}.panel{background:white;border:1px solid var(--line);border-radius:8px;padding:23px}label{display:block;font-weight:600;margin:0 0 17px}label input,label select,label textarea{display:block;width:100%;padding:10px;border:1px solid #aebfcb;border-radius:5px;margin-top:7px;background:white;color:var(--ink)}label small{font-weight:400}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:18px 0}.result{font-size:36px;font-weight:720;font-variant-numeric:tabular-nums;margin:5px 0 18px}.data{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}.data strong{display:block;font-size:20px}.export{background:var(--wash);padding:16px;border-radius:7px;margin-bottom:18px}.export label{margin-bottom:10px}.export small{display:block;margin-bottom:10px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:right;padding:10px 5px;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}details{margin:18px 0}summary{cursor:pointer;color:var(--blue)}.note{margin-top:30px;border-left:3px solid var(--blue);padding:12px 18px;background:white;max-width:900px}.note p{margin:5px 0}.oldnav{display:flex;gap:7px;flex-wrap:wrap;align-items:center;background:white;padding:16px;border:1px solid var(--line)}.oldhero{text-align:center;padding:35px 0}.oldhero h1{font-size:32px}.banner{background:#4f46a5;color:white;padding:10px;font-size:13px}.oldpills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.oldresult{background:#eef0ff;padding:16px;border-radius:12px;text-align:center}.hidden{display:none!important}#toast{position:fixed;bottom:22px;right:22px;padding:14px 20px;background:var(--ink);color:white;border-radius:7px;max-width:calc(100vw - 40px)}.file{padding:25px;border:1px dashed #8ca9bb;text-align:center;border-radius:7px}.check{display:flex;gap:10px;font-weight:400}.check input{width:auto;margin:5px 0}.caption{font-size:13px;margin:12px 0 0}.historytitle{font-weight:650}.review small{color:#dbe3ea} @media(max-width:1000px){main{padding:28px 25px}.work{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.layout{grid-template-columns:170px 1fr}}@media(max-width:650px){.layout{display:block}aside{padding:12px;flex-direction:row;flex-wrap:wrap;border-bottom:1px solid var(--line)}.brand{padding:5px 10px;font-size:19px}.bottom{margin:0;padding:0;display:flex}.grid{grid-template-columns:1fr}main{padding:24px 16px}.top{align-items:flex-start}.top small{white-space:normal}.review{gap:8px;padding:10px}.row{align-items:flex-start}.data{gap:8px}.result{font-size:30px}}
</style>
<body>
<div class="review"><strong>UX review mock</strong><small>Illustrative data · no app changes</small><button id="before" onclick="show('before')">Existing pattern</button><button id="after" class="active" onclick="show('tools')">Proposed screens</button></div>
<div class="layout"><aside><div class="brand">OfficeKit</div><button data-nav="tools" onclick="show('tools')">Tools</button><button data-nav="favorites" onclick="show('favorites')">Favorites</button><button data-nav="history" onclick="show('history')">History</button><div class="bottom"><button data-nav="feedback" onclick="show('feedback')">Help & feedback</button><button onclick="toast('Settings would contain privacy, retention, licensing and updates.')">Settings</button></div></aside><main id="content"></main></div><div id="toast" class="hidden" role="status" aria-live="polite"></div>
<script>
let page='tools',saved=false,favorite=true,filter='all',exportOpen=false,feedbackType='bug',timer;
const content=document.getElementById('content');
function toast(message){document.getElementById('toast').textContent=message;document.getElementById('toast').classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>document.getElementById('toast').classList.add('hidden'),4500)}
function note(title,text){return `<div class="note"><strong>Review: ${title}</strong><p>${text}</p></div>`}
function heading(title,sub=''){return `<div class="top"><div><h1>${title}</h1>${sub?`<span class="muted">${sub}</span>`:''}</div><small>Local processing</small></div>`}
function card(name,description,target='calculator'){return `<div class="tool"><button onclick="show('${target}')"><h3>${name}</h3><small>${description}</small></button>${name==='Loan calculator'?`<button class="star" aria-label="${favorite?'Remove from':'Add to'} favorites" aria-pressed="${favorite}" onclick="favorite=!favorite;show(page)">${favorite?'★':'☆'}</button>`:''}</div>`}
function show(target){page=target;document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('selected',b.dataset.nav===target));document.getElementById('before').classList.toggle('active',target==='before');document.getElementById('after').classList.toggle('active',target!=='before');
if(target==='before'){content.innerHTML=`<p class="muted">Source-based reconstruction of the existing calculator flow; not a screenshot.</p><div class="oldnav"><strong>OfficeKit</strong><button>Quick Search…</button><button>Bank & PDF</button><button>Converter</button><button>Calculators</button><button>Unlock PDF</button><button>Dictate & STT</button><button>Pass</button><button>Activate</button></div><div class="banner">OfficeKit v1.0 running with 100% offline privacy mode.</div><div class="oldhero"><h1>Financial & Business Calculators</h1><p>Calculator selection and results live inside one broad tab.</p></div><div class="oldpills"><button class="primary">Loan & EMI</button><button>Compound Interest</button><button>VAT / Sales Tax</button><button>Freelance Hourly Rate</button></div><div class="panel"><h2>Loan & EMI Calculator</h2><div class="data"><label>Principal ($)<input value="25000" readonly></label><label>Interest Rate (%)<input value="7.5" readonly></label><label>Tenure (Years)<input value="5" readonly></label></div><button class="primary">Calculate EMI</button><div class="oldresult actions"><span>Monthly EMI<br><strong>$500.95</strong></span><span>Total Interest<br><strong>$5,056.92</strong></span><span>Total Payment<br><strong>$30,056.92</strong></span></div></div>${note('Useful forms, weak continuity','The current inputs are straightforward. The surrounding navigation competes with the task, while calculator results have no export, bookmark or history action. The proposed screen preserves the simple form and adds reusable results.')}`;return}
if(target==='tools'||target==='favorites'){content.innerHTML=heading(target==='tools'?'Your everyday tools':'Favorites',target==='tools'?'Find a tool or pick up where you left off.':'Your shortcuts, kept here.')+(target==='tools'?`<input class="search" aria-label="Search tools" placeholder="Search tools — try loan, PDF or image" oninput="search(this.value)">`:'')+`<section class="block"><h2>${target==='tools'?'Favorites':'Pinned tools'}</h2><div class="grid">${favorite?card('Loan calculator','Monthly payment and repayment schedule'):''}${card('Convert images','JPG, PNG and WebP','converter')}${card('Merge PDFs','Combine documents','pdf')}</div>${!favorite?'<p class="muted">Star the Loan calculator to add it here.</p>':''}</section>`+(target==='tools'?`<section class="block"><h2>Recently used</h2><div class="row"><div><strong>Loan calculator</strong><br><small>Opened today</small></div><button onclick="show('calculator')">Open tool</button></div><div class="row"><div><strong>Convert images</strong><br><small>Opened yesterday</small></div><button onclick="show('converter')">Open tool</button></div></section><section><h2>Browse tools</h2><div class="tags"><button onclick="show('pdf')">PDF & documents</button><button onclick="show('converter')">Images</button><button onclick="show('calculator')">Calculators</button><button onclick="toast('Category browsing is outside this mock.')">Files & data</button></div></section>`:'')+note('A neutral starting point','Search and personal shortcuts replace the bank-statement default. Recent tools open fresh work; History opens a particular past result. Category chips are illustrative shortcuts in this prototype.');return}
if(target==='calculator'){content.innerHTML=heading('Loan calculator')+`<div class="actions"><button onclick="favorite=!favorite;show('calculator')" aria-pressed="${favorite}">${favorite?'★ Favorited':'☆ Favorite tool'}</button><button onclick="filter='loan';show('history')">Tool history</button></div><div class="work"><div class="panel"><h2>Loan details</h2><label>Currency<select><option>USD — US dollar</option><option>INR — Indian rupee</option><option>EUR — Euro</option></select></label><label>Loan amount<input type="number" value="25000" min="0"></label><label>Annual interest rate (%)<input type="number" value="7.5" step="0.1" min="0"></label><label>Term (years)<input type="number" value="5" min="1"></label><button class="primary" onclick="toast('Prototype: calculation is illustrative; inputs do not recalculate this result.')">Calculate</button></div><div class="panel"><h2>Monthly payment</h2><div class="result">$500.95</div><div class="data"><div><small>Total interest</small><strong>$5,056.92</strong></div><div><small>Total repayment</small><strong>$30,056.92</strong></div></div><small>Illustrative result: $25,000 at 7.5% over 60 monthly payments. Displayed values rounded.</small><div class="actions"><button class="primary" aria-expanded="${exportOpen}" onclick="exportOpen=!exportOpen;show('calculator')">Export…</button><button aria-pressed="${saved}" onclick="saved=!saved;show('calculator');toast(saved?'Saved to History → Saved.':'Bookmark removed; history entry remains.')">${saved?'▣ Saved result':'▢ Save result'}</button><button onclick="toast('Prototype: Copy would include the result and its input summary.')">Copy</button></div>${exportOpen?`<div class="export"><h3>Export this result</h3><label>Format<select id="format" onchange="exportHint(this.value)"><option>PDF</option><option>CSV</option><option>JPEG</option><option>PNG</option></select></label><small id="formatHint">Printable report with inputs, assumptions, summary and schedule.</small><label class="check"><input type="checkbox" checked>Include repayment schedule (PDF / CSV)</label><button class="primary" onclick="toast('Prototype only: no export file is generated.')">Choose location…</button></div>`:''}<details><summary>Inputs & assumptions</summary><p>USD 25,000 principal. Fixed annual rate: 7.5%. Five years. Monthly payments. No fees or extra repayments. Final payment adjusted for rounding in an implemented schedule.</p></details><details><summary>Repayment schedule</summary><div style="overflow:auto"><table><thead><tr><th>Month</th><th>Payment</th><th>Principal</th><th>Interest</th><th>Balance</th></tr></thead><tbody><tr><td>1</td><td>500.95</td><td>344.70</td><td>156.25</td><td>24,655.30</td></tr><tr><td>2</td><td>500.95</td><td>346.85</td><td>154.10</td><td>24,308.45</td></tr></tbody></table></div><small>First two rows shown in this mock.</small></details></div></div>${note('A result you can use again','Currency becomes explicit. One export entry keeps the result uncluttered; saving preserves the exact inputs and output. Exported reports contain context, rather than only a number or a screenshot of the app.')}`;return}
if(target==='history'){content.innerHTML=heading('History','Previous operations, stored on this device.')+`<div class="tags"><button class="${filter==='all'?'active':''}" onclick="filter='all';show('history')">All</button><button class="${filter==='saved'?'active':''}" onclick="filter='saved';show('history')">Saved</button><button class="${filter==='loan'?'active':''}" onclick="filter='loan';show('history')">Loan calculator</button></div><div class="row"><div><div class="historytitle">${saved?'▣ ':''}Loan payment — $25,000</div><small>Today, 10:42 · 7.5% · 5 years</small><br><span>$500.95 / month</span></div><button onclick="show('saved')">View result</button></div>${filter==='saved'&&!saved?'<p class="muted">No saved results yet. Open a result and choose Save result.</p>':''}${filter==='all'?`<div class="row"><div><div class="historytitle">Convert images — 3 files</div><small>Yesterday · Completed · WebP outputs</small></div><button onclick="show('converter')">View result</button></div><div class="row"><div><div class="historytitle">Merge PDFs — 2 files</div><small>Yesterday · Output reference unavailable</small></div><button onclick="toast('Locate file would reconnect the missing output without rerunning the operation.')">Locate file</button></div>`:''}<p class="caption muted">Proposed policy: unsaved entries expire after 30 days. Saved results remain until removed.</p>${note('One history, one saved filter','A bookmark pins an existing operation. Tool history is a filter of this same list. Clear-history controls belong in Settings, with saved results excluded by default.')}`;if(filter==='saved'&&!saved)content.querySelector('.row').remove();return}
if(target==='saved'){content.innerHTML=heading('Loan payment — $25,000','Original result · Today, 10:42')+`<div class="panel"><small>Monthly payment</small><div class="result">$500.95</div><p>USD 25,000 · Annual interest 7.5% · Term 5 years</p><div class="data"><div><small>Total interest</small><strong>$5,056.92</strong></div><div><small>Total repayment</small><strong>$30,056.92</strong></div></div><div class="actions"><button class="primary" onclick="exportOpen=true;show('calculator');toast('Prototype: export controls shown on the calculator screen. Production exports this original snapshot directly.')">Export…</button><button onclick="show('calculator');toast('Prototype: a new calculation would be seeded with these inputs.')">Use these inputs</button><button aria-pressed="${saved}" onclick="saved=!saved;show('saved')">${saved?'Remove bookmark':'Save result'}</button></div><label>Name<input value="Loan payment — $25,000" onblur="toast('Prototype: names are not persisted.')"></label><details><summary>Original assumptions</summary><p>Fixed interest, monthly payments, no fees. Original engine/version and timestamp are preserved with the record.</p></details></div>${note('Reopen without recalculating','The original result is immutable. Use these inputs starts a new run; export uses the original snapshot. Rename changes only the bookmark title.')}`;return}
if(target==='converter'||target==='pdf'){const pdf=target==='pdf';content.innerHTML=heading(pdf?'Merge PDFs':'Convert images')+`<div class="work"><div class="panel"><h2>${pdf?'Documents':'Input files'}</h2><div class="file">${pdf?'proposal.pdf<br>appendix.pdf':'photo-01.jpg<br>photo-02.jpg<br>photo-03.jpg'}<br><button onclick="toast('Prototype: native file picker is not connected.')">Add files…</button></div><label style="margin-top:20px">${pdf?'Output name':'Output format'}${pdf?'<input value="merged.pdf">':'<select><option>WebP</option><option>JPEG</option><option>PNG</option></select>'}</label><details><summary>${pdf?'Page options':'Quality & metadata'}</summary><p>${pdf?'Reorder documents before merging.':'Preserve originals. Review quality and metadata removal before running.'}</p></details><button class="primary" onclick="toast('Prototype: sample completed state is already shown.')">${pdf?'Merge PDFs':'Convert 3 images'}</button></div><div class="panel"><h2>${pdf?'PDF ready':'3 images converted'}</h2><p class="muted">${pdf?'merged.pdf · 12 pages':'JPG → WebP · 4.2 MB → 1.1 MB'}</p><div class="row"><span>${pdf?'merged.pdf':'photo-01.webp'}</span><small>Completed</small></div>${!pdf?'<div class="row"><span>photo-02.webp</span><small>Completed</small></div><div class="row"><span>photo-03.webp</span><small>Completed</small></div>':''}<div class="actions"><button class="primary" onclick="toast('Prototype: choose an output folder and confirm names before writing files.')">Save ${pdf?'PDF':'files'}…</button><button onclick="toast('Prototype: bookmarking would retain a local output copy with this operation.')">Save result</button></div><small>Save result keeps a local copy for later. Exported originals are never deleted when history is cleared.</small></div></div>${note('Conversion has a destination and an outcome','Show supported formats, output sizes, per-file outcomes and a deliberate save destination. A PDF tool produces a PDF; it does not inherit irrelevant calculator export formats.')}`;return}
if(target==='feedback'){content.innerHTML=heading('Help & feedback')+`<div class="tags" style="margin-bottom:24px"><button class="${feedbackType==='bug'?'active':''}" onclick="feedbackType='bug';show('feedback')">Report a bug</button><button class="${feedbackType==='feature'?'active':''}" onclick="feedbackType='feature';show('feedback')">Request a feature</button><button class="${feedbackType==='testimonial'?'active':''}" onclick="feedbackType='testimonial';show('feedback')">Leave a testimonial</button></div><div class="panel" style="max-width:690px"><label>${feedbackType==='bug'?'What went wrong?':feedbackType==='feature'?'What would you like to do?':'Your experience'}<textarea rows="4" placeholder="${feedbackType==='bug'?'Describe what happened and what you expected.':feedbackType==='feature'?'Tell us about the task and your current workaround.':'What has OfficeKit helped you accomplish?'}"></textarea></label><label>${feedbackType==='testimonial'?'Display name (optional)':'Email for a reply (optional)'}<input type="${feedbackType==='testimonial'?'text':'email'}"></label>${feedbackType==='bug'?'<label class="check"><input type="checkbox">Attach diagnostics</label><details><summary>Preview diagnostics</summary><p>App version, OS version, tool ID and error code. No document contents, tokens or file paths.</p></details>':''}${feedbackType==='testimonial'?'<label class="check"><input type="checkbox">OfficeKit may publish this testimonial with my display name.</label>':''}<div class="actions"><button class="primary" onclick="toast('Prototype: online delivery is not connected. No feedback was sent.')">Send feedback</button><button onclick="toast('Prototype: local draft saving is not connected.')">Save draft</button></div><small>Sending requires an internet connection. Offline feedback can be kept as a draft.</small></div>${note('An honest feedback flow','Different questions for different intentions. Diagnostics are optional and reviewable. Publication permission is separate. A local draft is never described as received or triaged by engineering.')}`}
}
function exportHint(value){document.getElementById('formatHint').textContent={PDF:'Printable report with inputs, assumptions, summary and schedule.',CSV:'Structured numeric rows, units and inputs; schedule as a separate CSV when selected.',JPEG:'Shareable summary image with inputs and assumptions on a white background.',PNG:'Sharper lossless summary image for text and numbers.'}[value]}
function search(value){const q=value.toLowerCase();document.querySelectorAll('.tool').forEach(el=>el.classList.toggle('hidden',!el.textContent.toLowerCase().includes(q)))}
show('tools');
</script>
</body></html>
