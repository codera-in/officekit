<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OfficeKit image transparency conversion note</title>
  <style>
    :root{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182338;background:#f6f8fc;--line:#dbe2ec;--accent:#4438ca;--muted:#65748b}
    *{box-sizing:border-box}body{margin:0;padding:40px 20px}.app{max-width:680px;margin:auto;border:1px solid var(--line);border-radius:16px;background:white;padding:28px;box-shadow:0 8px 28px #26324712}
    .brand{font-weight:750;color:var(--accent);font-size:14px;letter-spacing:.02em}h1{font-size:26px;line-height:1.2;margin:18px 0 4px}p{margin:0;color:var(--muted)}.file{margin-top:24px;border:1px dashed var(--line);border-radius:12px;padding:18px;color:#25334a}
    .label{font-size:13px;font-weight:700;margin:22px 0 8px;color:#34445c}.formats{display:flex;gap:10px;flex-wrap:wrap}.format{padding:10px 16px;border:1px solid var(--line);border-radius:10px;background:white;font-weight:700;color:#34445c}.format.selected{border:2px solid var(--accent);color:var(--accent);background:#f4f2ff}
    .note{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px 14px;border:1px solid #d9d5ff;border-radius:10px;background:#f7f6ff;color:#313b5a;font-size:13px}.note strong{display:block;color:#262d49;margin-bottom:2px}.icon{font-weight:800;color:var(--accent)}.button{margin-top:22px;padding:12px 18px;border:0;border-radius:10px;background:var(--accent);color:white;font-weight:700;font-size:15px}
  </style>
</head>
<body>
  <main class="app">
    <div class="brand">OfficeKit · IMAGES</div>
    <h1>Convert a file</h1>
    <p>Choose an image and select an output format.</p>
    <div class="file">portrait.tiff · 128 KB</div>
    <div class="label">Convert to</div>
    <div class="formats" aria-label="Output format">
      <button class="format">PNG</button><button class="format selected">JPEG</button><button class="format">WebP</button><button class="format">BMP</button>
    </div>
    <aside class="note" role="note">
      <span class="icon" aria-hidden="true">i</span>
      <span><strong>Transparency will be flattened</strong>JPEG cannot store transparent pixels. OfficeKit composites them onto white. Choose PNG or WebP to keep transparency.</span>
    </aside>
    <button class="button">Convert &amp; Download</button>
  </main>
</body>
</html>
