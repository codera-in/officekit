<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OfficeKit gallery result-count copy</title>
  <link rel="stylesheet" href="../officekit-tokens.css">
  <style>
    *{box-sizing:border-box}body{margin:0;padding:32px;background:var(--ok-bg);color:var(--ok-text);font:15px/1.5 var(--ok-font)}main{max-width:760px;margin:auto}section{display:grid;grid-template-columns:1fr 1fr;gap:16px}article{padding:20px;border:1px solid var(--ok-line);border-radius:12px;background:var(--ok-surface)}small{color:var(--ok-muted)}strong{display:block;margin-top:14px;font-size:18px}@media(max-width:600px){section{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main>
    <small>Tool Gallery · search status</small>
    <h1>Singular result count</h1>
    <section aria-label="Before and after">
      <article><small>Before</small><strong>1 tools</strong></article>
      <article><small>After</small><strong>1 tool</strong></article>
    </section>
  </main>
</body>
</html>
