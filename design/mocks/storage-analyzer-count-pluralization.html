<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OfficeKit storage count copy correction</title>
  <link rel="stylesheet" href="../officekit-tokens.css">
  <style>
    *{box-sizing:border-box}body{margin:0;padding:24px;background:var(--ok-bg);color:var(--ok-text);font:15px/1.5 var(--ok-font)}main{max-width:900px;margin:auto}h1{font-size:24px}section{display:grid;grid-template-columns:1fr 1fr;gap:16px}article{padding:20px;border:1px solid var(--ok-line);border-radius:10px;background:var(--ok-surface)}small{color:var(--ok-muted)}strong{display:block;margin-top:16px;font-size:18px}@media(max-width:640px){section{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main>
    <small>Storage Analyzer · result summary copy only</small>
    <h1>Singular file count</h1>
    <section aria-label="Before and after">
      <article><small>Before</small><strong>1 files · 0.00 MiB total · partial scan</strong></article>
      <article><small>After</small><strong>1 file · 0.00 MiB total · partial scan</strong></article>
    </section>
  </main>
</body>
</html>
