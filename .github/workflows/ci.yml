name: OfficeKit tests

# Runs on GitHub-hosted machines only. It uses no secrets and a read-only token, so a pull request from a
# fork cannot reach anything private. Never switch this to `pull_request_target` or a self-hosted runner.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on GitHub-hosted macOS
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install pinned Python and sidecar build dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Install locked Node dependencies
        run: npm ci

      - name: Run Node and Python test suites
        run: npm test

      - name: Install the browser the UI tests use
        run: npx playwright install webkit

      # A locked first launch must show the activation flow and nothing else: no license_required toast
      # and no error dialog. These tests caught that, but only when run by hand, and v1.0.108 shipped.
      - name: Run the locked-app UI tests
        run: npm run build:ui && node scripts/ui-browser-preflight.mjs && npx playwright test ui-tests/locked-app.spec.mjs

      - name: Build media CLI resource for Rust tests
        run: |
          mkdir -p src-tauri/binaries
          rustc --edition=2021 src-tauri/media-cli-launcher.rs -o src-tauri/binaries/officekit-media

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
