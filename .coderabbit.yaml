language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_filters:
    - "!dist-ui/**"
    - "!src-tauri/resources/**"
    - "!src-tauri/gen/**"
    - "!package-lock.json"
    - "!**/*.icns"
  path_instructions:
    - path: ".github/workflows/**"
      instructions: >-
        Release workflows hold signing and notarization secrets. Flag anything that exposes a secret to
        pull requests from forks, uses pull_request_target, or loads an action by a moving tag.
    - path: "src-tauri/**"
      instructions: >-
        Native shell. Check permissions, entitlements, path validation and that nothing logs file
        contents or secrets.
    - path: "scripts/**"
      instructions: >-
        Build and release scripts are JavaScript or TypeScript only, and must not interpolate untrusted
        input into shell commands.
chat:
  auto_reply: true
